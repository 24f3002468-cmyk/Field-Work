services:
  # FastAPI Backend Web Service on Render
  - type: web
    name: ml-dashboard-backend
    env: python
    region: singapore # or oregon / frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set your Neon PostgreSQL URL here
      - key: SECRET_KEY
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: PYTHONPATH
        value: ./backend

  # React Frontend Static Site on Render
  - type: web
    name: ml-dashboard-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ml-dashboard-backend.onrender.com/api/v1
