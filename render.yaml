services:
  # Single All-in-One Web Service on Render (Serves both React UI and FastAPI API)
  - type: web
    name: field-work
    env: python
    region: singapore
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false # Set your Neon PostgreSQL URL here
      - key: SECRET_KEY
        generateValue: true
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: PYTHONPATH
        value: ./backend
